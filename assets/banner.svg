<g font-family="Segoe UI, Arial, sans-serif"><text x="64" y="90" font-size="14" letter-spacing="4" fill="#c4b5fd">DESENVOLVIMENTO · IA · SEGURANÇA</text><text x="60" y="171" font-size="74" font-weight="700" fill="#f8fafc">Fcoudgui<tspan fill="#f9a8d4">.</tspan></text><text x="64" y="214" font-size="24" fill="#d8d0e7">Código, ideias e aprendizado.</text><rect x="64" y="246" width="222" height="34" rx="17" fill="#c4b5fd" fill-opacity=".1" stroke="#c4b5fd" stroke-opacity=".3"/><text x="82" y="268" font-size="13" fill="#e9d5ff">CONSTRUINDO UM PROJETO POR VEZ</text></g>
<rect x="802" y="85" width="326" height="198" rx="14" fill="#0d1117" stroke="#c4b5fd" stroke-opacity=".3"/>
<path d="M802 121H1128" stroke="#c4b5fd" stroke-opacity=".15"/><circle cx="823" cy="104" r="4" fill="#f9a8d4"/><circle cx="839" cy="104" r="4" fill="#c4b5fd"/><circle cx="855" cy="104" r="4" fill="#86efac"/>
<g font-family="Consolas, monospace" font-size="17"><text x="827" y="157" fill="#c4b5fd">while (aprendendo) {</text><text x="847" y="191" fill="#e2e8f0">explorar();</text><text x="847" y="222" fill="#f9a8d4">construir();</text><text x="827" y="257" fill="#c4b5fd">}</text></g>
