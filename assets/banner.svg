<g fill="#e9d5ff" opacity=".6"><circle cx="58" cy="48" r="1.5"/><circle cx="565" cy="64" r="2"/><circle cx="730" cy="42" r="1.5"/><circle cx="1136" cy="65" r="2"/><circle cx="667" cy="155" r="1"/><circle cx="1087" cy="292" r="1.5"/></g>
