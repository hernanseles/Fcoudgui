<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Fcoudgui — código, ideias e aprendizado</title>
<desc id="desc">Banner escuro com horizonte roxo e rosa, estrelas e uma janela de código.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset=".6" stop-color="#19132e"/><stop offset="1" stop-color="#352044"/></linearGradient><linearGradient id="accent"><stop stop-color="#a78bfa"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><radialGradient id="glow"><stop stop-color="#c084fc" stop-opacity=".3"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient></defs>
